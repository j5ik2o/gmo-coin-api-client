[package]
name = "gmo-coin-api-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "GMOコインの暗号資産取引API (Public/Private REST と WebSocket) を呼び出す非同期クライアント"
license = "MIT OR Apache-2.0"
repository = "https://github.com/j5ik2o/gmo-coin-api-client"
homepage = "https://github.com/j5ik2o/gmo-coin-api-client"
documentation = "https://docs.rs/gmo-coin-api-client"
readme = "README.md"
keywords = ["gmo", "cryptocurrency", "exchange", "trading", "websocket"]
categories = [
    "api-bindings",
    "asynchronous",
    "cryptography::cryptocurrencies",
    "finance",
    "web-programming::websocket",
]
# リポジトリ専用のファイルと、リポジトリの CI で回すテストは crates.io の
# パッケージに載せない。テスト用の TLS 秘密鍵 (tests/fixtures/tls) も含めない。
exclude = [
    "/.github",
    "/.gitignore",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/clippy.toml",
    "/deny.toml",
    "/renovate.json",
    "/rust-toolchain.toml",
    "/tests",
    "/tools",
]

[dependencies]
tokio = { version = "1.54", default-features = false, features = ["net", "time", "io-util", "macros", "rt", "sync"] }
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
http = "1.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
ring = "0.17"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tokio = { version = "1.54", default-features = false, features = ["net", "time", "io-util", "macros", "rt", "rt-multi-thread", "sync"] }
hyper = { version = "1.12", default-features = false, features = ["client", "http1", "server"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The rustdoc contract headings are Japanese (# エラー, # パニック); these two lints accept only the English headings.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Opinionated pedantic lint; results that must not be ignored are already Result or carry #[must_use] by hand.
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
