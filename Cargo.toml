[package]
name = "gmo-coin-api-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "GMOコインの暗号資産取引API (Public/Private REST と WebSocket) を呼び出す非同期クライアント"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tokio = { version = "1.54", default-features = false, features = ["net", "time", "io-util", "macros", "rt"] }
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
http = "1.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
ring = "0.17"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tokio = { version = "1.54", default-features = false, features = ["net", "time", "io-util", "macros", "rt", "rt-multi-thread"] }
hyper = { version = "1.12", default-features = false, features = ["client", "http1", "server"] }
